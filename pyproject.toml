[project]
authors = [{ name = "Geoff Boeing", email = "boeing@usc.edu" }]
dependencies = [
    "jupyterlab",
    "networkx==3.5.*",
    "osmnx==2.0.*",
    "pandas==2.2.*",
    "pre-commit",
    "scipy==1.15.*",
]
description = "MST analysis of urban street networks. "
license = "MIT"
license-files = ["LICENSE.txt"]
name = "mst"
readme = "README.md"
requires-python = ">=3.13"
version = "0.0.0"

[tool.ruff]
cache-dir = "~/.cache/pre-commit/ruff"
line-length = 100

[tool.ruff.lint]
extend-ignore = ["T201"]
extend-select = ["A", "B", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.pycodestyle]
max-line-length = 110 # line length + 10% since it isn't a hard upper bound

[tool.uv]
required-version = "==0.7.12"
