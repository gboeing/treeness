[project]
authors = [{ name = "Geoff Boeing", email = "boeing@usc.edu" }]
dependencies = [
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.8",
    "matplotlib>=3.11.0",
    "momepy>=0.11.0",
    "nbdime>=4.0.4",
    "neatnet>=0.1.6",
    "networkx>=3.6.1",
    "osmnx>=2.1.0",
    "pandas>=3.0.3",
    "prek>=0.4.5",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]
description = "Analysis of urban street networks treeness"
license = "MIT"
license-files = ["LICENSE.txt"]
name = "treeness"
readme = "README.md"
requires-python = ">=3.14"
version = "0.0.0"

[tool.ruff]
cache-dir = "~/.cache/prek/cache/ruff"
line-length = 100

[tool.ruff.lint]
extend-ignore = ["T201"]
extend-select = ["A", "B", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.pycodestyle]
max-line-length = 110 # line length + 10% since it isn't a hard upper bound

[tool.uv]
required-version = "==0.11.*"
